[workspace]
resolver = "2"
members = ["crates/quilt-mhs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The Quilt Authors"]
repository = "https://github.com/SuperInstance/quilt-mhs"
description = "Bridge the quilt ecosystem to the Model Hardware Standard (MHS): quilt drives MHS devices, and quilt runtimes expose themselves as MHS devices."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
